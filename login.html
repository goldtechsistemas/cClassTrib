<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — cClassTrib</title>
  <script>(function(){try{var t=localStorage.getItem('cclasstrib-tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container auth-container">
    <section class="hero">
      <h1>cClassTrib</h1>
      <p id="subtitulo-login">Entre para continuar</p>
    </section>

    <div class="card auth-card">
      <div id="erro-login" class="aviso-legal" style="display:none;"></div>

      <div id="etapa-entrar">
        <label for="input-email">E-mail</label>
        <input type="email" id="input-email" placeholder="voce@exemplo.com" autocomplete="username" />

        <label for="input-senha" style="margin-top:14px;">Senha</label>
        <input type="password" id="input-senha" placeholder="Sua senha" autocomplete="current-password" />

        <label class="checkbox-linha" for="input-lembrar" style="margin-top:14px;">
          <input type="checkbox" id="input-lembrar" />
          Deseja salvar seu login?
        </label>

        <div class="field-actions">
          <button class="btn" id="btn-entrar">Entrar</button>
        </div>
      </div>

      <div id="etapa-nova-senha" style="display:none;">
        <p class="hint" style="margin-top:0;">Este é o seu primeiro acesso. Crie agora a sua senha — ela vai substituir a senha provisória.</p>

        <label for="input-nova-senha">Nova senha</label>
        <input type="password" id="input-nova-senha" placeholder="No mínimo 6 caracteres" autocomplete="new-password" />

        <label for="input-nova-senha-confirmar" style="margin-top:14px;">Confirmar nova senha</label>
        <input type="password" id="input-nova-senha-confirmar" placeholder="Digite a senha de novo" autocomplete="new-password" />

        <div class="field-actions">
          <button class="btn" id="btn-salvar-nova-senha">Salvar e entrar</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
